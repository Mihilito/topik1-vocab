<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<!-- スマホのホーム画面に追加したとき、アプリのように全画面で開くための指定 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOPIK単語">
<title>TOPIK Ⅰ 単語トレーニング</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- ============ ホーム ============ -->
  <section id="screen-home" class="screen">
    <header class="hero">
      <p class="hero-sub">TOPIK Ⅰ（初級 1〜2級）全1000語</p>
      <h1 class="hero-title">韓国語 単語トレーニング</h1>
    </header>

    <div class="stats-row">
      <div class="stat"><span class="stat-num" id="stat-unseen">0</span><span class="stat-label">未出題</span></div>
      <div class="stat"><span class="stat-num" id="stat-learned">0</span><span class="stat-label">出題済み</span></div>
      <div class="stat"><span class="stat-num" id="stat-mastered">0</span><span class="stat-label">マスター</span></div>
      <div class="stat stat-weak"><span class="stat-num" id="stat-weak">0</span><span class="stat-label">苦手</span></div>
    </div>

    <div class="card">
      <h2 class="card-title">出題の方向</h2>
      <div class="chips" id="dir-chips">
        <button class="chip is-on" data-dir="ko2ja">韓国語 → 日本語</button>
        <button class="chip" data-dir="ja2ko">日本語 → 韓国語</button>
        <button class="chip" data-dir="mix">ミックス</button>
      </div>

      <h2 class="card-title">問題数</h2>
      <div class="chips" id="count-chips">
        <button class="chip is-on" data-count="10">10問</button>
        <button class="chip" data-count="20">20問</button>
        <button class="chip" data-count="0">全部</button>
      </div>

      <h2 class="card-title">苦手な単語を混ぜる</h2>
      <div class="chips" id="mix-chips">
        <button class="chip" data-mix="0">混ぜない</button>
        <button class="chip is-on" data-mix="0.3">3割</button>
        <button class="chip" data-mix="0.5">半分</button>
      </div>

      <button class="btn btn-primary btn-block" id="btn-start">出題スタート</button>
      <p class="hint" id="start-hint"></p>
      <button class="btn btn-review btn-block" id="btn-review">
        苦手な単語だけ復習 <span class="badge" id="review-badge">0</span>
      </button>
      <p class="hint" id="review-hint">間違えた単語がここに溜まります。</p>
    </div>

    <div class="link-row">
      <button class="linkbtn" id="btn-list">単語一覧を見る</button>
      <button class="linkbtn linkbtn-danger" id="btn-reset">学習記録をリセット</button>
    </div>
  </section>

  <!-- ============ 出題 ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="quiz-top">
      <button class="iconbtn" id="btn-quit">×</button>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <span class="counter" id="counter">1 / 10</span>
    </div>

    <div class="question">
      <p class="q-direction" id="q-direction">韓国語 → 日本語</p>
      <p class="q-word" id="q-word">사람</p>
      <p class="q-pos" id="q-pos">名詞</p>
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback" hidden>
      <p class="fb-judge" id="fb-judge">正解！</p>
      <div class="fb-answer">
        <span class="fb-ko" id="fb-ko"></span>
        <span class="fb-ja" id="fb-ja"></span>
      </div>
      <div class="example">
        <p class="example-label">例文</p>
        <p class="example-ko" id="example-ko"></p>
        <p class="example-ja" id="example-ja"></p>
      </div>
      <button class="btn btn-primary btn-block" id="btn-next">次へ</button>
    </div>
  </section>

  <!-- ============ 結果 ============ -->
  <section id="screen-result" class="screen" hidden>
    <header class="hero">
      <p class="hero-sub" id="result-sub">お疲れさまでした</p>
      <h1 class="hero-title"><span id="result-score">0</span> / <span id="result-total">0</span> 正解</h1>
    </header>

    <div class="card">
      <h2 class="card-title" id="wrong-title">間違えた単語</h2>
      <div id="wrong-list" class="wrong-list"></div>
      <button class="btn btn-review btn-block" id="btn-retry-wrong">この回の間違いをもう一度</button>
      <button class="btn btn-ghost btn-block" id="btn-home">ホームに戻る</button>
    </div>
  </section>

  <!-- ============ 単語一覧 ============ -->
  <section id="screen-list" class="screen" hidden>
    <div class="list-top">
      <button class="iconbtn" id="btn-list-back">←</button>
      <input type="search" id="list-search" placeholder="韓国語・日本語で検索">
    </div>
    <div id="word-list" class="word-list"></div>
  </section>

</div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
